extends: _model_robustness_common.yaml

project:
  output_dir: ../outputs/gpt_5_1_main_r10

model:
  provider: openai_compatible
  api_style: anyapi
  model_name: gpt-5.1-2025-11-13
  api_base: https://www.anyapi.vip/v1
  api_key_env: ANYAPI_API_KEY
  reasoning_effort: none
  omit_temperature: true
  max_tokens: 2048
  max_tokens_parameter: max_completion_tokens
  response_format:
    type: json_object
  timeout_seconds: 180
  connect_timeout_seconds: 20
  pool_timeout_seconds: 180
  max_retries: 4
  retry_backoff_seconds: 15
  api_concurrency: 4
