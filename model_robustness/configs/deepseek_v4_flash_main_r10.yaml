extends: _model_robustness_common.yaml

project:
  output_dir: ../outputs/deepseek_v4_flash_main_r10

model:
  provider: openai_compatible
  api_style: deepseek
  model_name: deepseek-v4-flash
  api_base: https://api.deepseek.com
  api_key_env: DEEPSEEK_API_KEY
  temperature: 0.7
  max_tokens: 2048
  max_tokens_parameter: max_tokens
  omit_temperature: false
  response_format:
    type: json_object
  extra_body:
    thinking:
      type: disabled
  timeout_seconds: 180
  connect_timeout_seconds: 20
  pool_timeout_seconds: 180
  max_retries: 4
  retry_backoff_seconds: 15
  api_concurrency: 4
